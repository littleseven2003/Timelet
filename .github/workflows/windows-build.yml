name: Windows x64 构建

on:
  push:
    branches: [feat/platform-build]
    paths:
      - .github/workflows/windows-build.yml
      - src/**
      - src-tauri/**
      - public/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - '*config*'
      - index.html
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 检查并构建 NSIS 安装包
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false

      - name: 安装 pnpm
        run: npm install --global pnpm@11.9.0

      - name: 配置 Rust 工具链
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable

      - name: 记录构建环境
        run: |
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --version --verbose

      - name: 按锁文件安装依赖
        run: pnpm install --frozen-lockfile

      - name: 前端静态检查
        run: pnpm lint

      - name: 前端业务回归
        run: pnpm test

      - name: 类型检查与前端构建
        run: pnpm build

      - name: Rust 格式检查
        working-directory: src-tauri
        run: cargo fmt --check

      - name: 同步 Windows 特性并验证调试编译
        run: pnpm check:desktop

      - name: Rust 业务回归
        working-directory: src-tauri
        run: cargo test --locked --lib

      - name: Rust 静态检查
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: 构建 Windows x64 安装包
        run: pnpm bundle:windows

      - name: 生成安装包校验和
        run: |
          $bundlePath = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $installers = @(Get-ChildItem -Path $bundlePath -Filter '*.exe' -File)
          if ($installers.Count -eq 0) { throw '未找到 NSIS 安装包' }
          $checksums = $installers | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -LiteralPath "$bundlePath/SHA256SUMS.txt" -Encoding utf8
          $checksums

      - name: 保存安装包（7 天）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Timelet-windows-x64-${{ github.sha }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
