e)+' 天"><span style="width:'+progressOf(panelFocus)+'%"></span><i style="left:calc('+progressOf(panelFocus)+'% - 3px)"></i></div></div>';content+=list(active.filter(r=>r.id!==panelFocus?.id&&!urgent.includes(r)).slice(0,3),true);timeletFind('#t-panel-content').innerHTML=content;timeletFind('#t-pause-button').innerHTML=icon(paused?'play':'pause');timeletFind('#t-pause-button').setAttribute('aria-label',paused?'恢复提醒':'暂停提醒');}
  function switchScreen(next){screen=next;['main','panel','editor'].forEach(s=>{timeletFind('#t-'+s+'-screen').hidden=s!==next;});timeletFindAll('.t-review [data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===next)));if(next==='editor')timeletFind('#t-name').focus();}
  function typePicker(){ timeletFind('#t-type-picker').innerHTML=Object.entries(labels).map(([key,name])=>'<button type="button" data-type="'+key+'" aria-pressed="'+(editorType===key)+'">'+symbol(key)+name+'</button>').join('');timeletFind('#t-editor-hint').textContent={countdown:'从今天计算到哪一天？',elapsed:'从哪一天开始计算？',reminder:'希望在什么时候收到提醒？'}[editorType];timeletFind('#t-date-label').textContent={countdown:'目标日期',elapsed:'起始日期',reminder:'提醒日期'}[editorType];timeletFind('#t-time').hidden=editorType!=='reminder';timeletFind('#t-date-row').classList.toggle('no-time',editorType!=='reminder');timeletFind('#t-notify-label').innerHTML=editorType==='reminder'?'启用提醒<small>到指定时刻，提醒你处理</small>':editorType==='elapsed'?'周年提醒我<small>每一次抵达，都值得记住</small>':'当天提醒我<small>在重要的日子，轻轻提醒一下</small>';preview();}
  function preview(){const date=timeletFind('#t-date').value;if(!date){timeletFind('#t-live-preview').innerHTML=symbol(editorType)+'<p>选一个日期，时间就有了方向。</p>';return;}const r={type:editorType,date,time:timeletFind('#t-time').value};const d=display(r);timeletFind('#t-live-preview').innerHTML=symbol(editorType)+'<div><p>'+escape(timeletFind('#t-name').value.trim()||'这个重要时刻')+' · '+escape(d.spoken)+'</p><span>'+fullDate(date)+(editorType==='reminder'?' '+r.time:'')+'</span></div>';}
  function openEditor(id){editorId=id||null;const r=records.find(r=>r.id===id);editorType=r?.type||'countdown';timeletFind('#t-name').value=r?.name||'';timeletFind('#t-date').value=r?.date||'2026-09-05';timeletFind('#t-time').value=r?.time||'18:30';timeletFind('#t-note').value=r?.note||'';timeletFind('#t-group').value=r?.group||'个人';timeletFind('#t-pin').checked=r?.pinned||false;timeletFind('#t-notify').checked=editorType==='reminder';timeletFind('#t-editor-more').open=false;timeletFind('#t-name-error').hidden=true;timeletFind('#t-date-error').hidden=true;timeletFind('#t-editor-title').textContent=r?'编辑条目':'新建条目';timeletFind('#t-create-button').textContent=r?'保存修改':'创建条目';typePicker();switchScreen('editor');}
  function saveExample(event){event.preventDefault();const name=timeletFind('#t-name').value.trim(),date=timeletFind('#t-date').value;timeletFind('#t-name-error').hidden=!!name;timeletFind('#t-date-error').hidden=!!date;if(!name||!date){(!name?timeletFind('#t-name'):timeletFind('#t-date')).focus();return;}const previous=records.map(r=>({...r})),index=records.findIndex(r=>r.id===editorId);const next={id:editorId||'example-'+Date.now(),name,type:editorType,date,time:timeletFind('#t-time').value,created:index>=0?records[index].created:'2026-08-31',note:timeletFind('#t-note').value,group:timeletFind('#t-group').value,pinned:timeletFind('#t-pin').checked,state:'active'};if(index>=0)records[index]=next;else records.push(next);filter='all';layout='list';timeletFind('#t-search').value='';timeletFindAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout==='list')));render();switchScreen('main');status(index>=0?'示例修改已保存。':'示例条目已创建，不会保存到软件或发送通知。',previous);}
  root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.screen){if(b.dataset.screen==='editor')openEditor();else switchScreen(b.dataset.screen);return;}if(b.dataset.filter){filter=b.dataset.filter;expanded='';render();switchScreen('main');return;}if(b.dataset.layout){layout=b.dataset.layout;timeletFindAll('[data-layout]').forEach(el=>el.setAttribute('aria-pressed',String(el===b)));render();return;}if(b.dataset.expand){expanded=expanded===b.dataset.expand?'':b.dataset.expand;render();const selector=screen==='panel'?'#t-panel-content':'#t-main-content';timeletFind(selector)?.querySelector('[data-expand="'+b.dataset.expand+'"]')?.focus();return;}if(b.dataset.type){editorType=b.dataset.type;timeletFind('#t-notify').checked=editorType==='reminder';if(editorType==='elapsed'&&!editorId)timeletFind('#t-date').value='2025-10-06';else if(!editorId)timeletFind('#t-date').value=editorType==='reminder'?'2026-08-31':'2026-09-05';typePicker();return;}if(b.dataset.date){timeletFind('#t-date').value=b.dataset.date;preview();return;}if(b.dataset.action==='open-main'){filter='all';expanded='';timeletFind('#t-search').value='';render();switchScreen('main');timeletFind('#t-search').focus();return;}if(b.dataset.action==='cancel-editor'){switchScreen('main');return;}if(b.dataset.action==='pause'){paused=!paused;render();status(paused?'示例提醒已暂停。':'示例提醒已恢复。');return;}if(b.dataset.action){const r=records.find(r=>r.id===b.dataset.id);if(!r)return;if(b.dataset.action==='edit'){openEditor(r.id);return;}const previous=records.map(r=>({...r}));if(b.dataset.action==='complete'){r.state='completed';expanded='';status('示例提醒已完成。',previous);}if(b.dataset.action==='archive'){r.state='archived';expanded='';status('示例条目已归档，可随时恢复。',previous);}if(b.dataset.action==='restore'){r.state='active';expanded='';status('示例条目已恢复。',previous);}if(b.dataset.action==='pin'){r.pinned=!r.pinned;status(r.pinned?'示例条目已置顶。':'示例条目已取消置顶。',previous);}if(b.dataset.action==='snooze'){const [h,m]=r.time.split(':').map(Number);const total=h*60+m+10;r.time=String(Math.floor(total/60)%24).padStart(2,'0')+':'+String(total%60).padStart(2,'0');if(total>=1440)r.date=new Date(Date.parse(r.date+'T00:00:00Z')+dayMs).toISOString().slice(0,10);status('示例已延后 10 分钟，不会发送通知。',previous);}render();}});
  root.addEventListener('change',event=>{if(['t-appearance','t-settings-appearance'].includes(event.target.id)){root.dataset.appearance=event.target.value;timeletFind('#t-appearance').value=event.target.value;if(timeletFind('#t-settings-appearance'))timeletFind('#t-settings-appearance').value=event.target.value;}if(event.target.id==='t-settings-pause'){paused=event.target.checked;render();status(paused?'示例提醒已暂停。':'示例提醒已恢复。');}});
  timeletFind('#t-search').addEventListener('input',render);['t-name','t-date','t-time'].forEach(id=>timeletFind('#'+id).addEventListener('input',preview));timeletFind('#t-create-button').addEventListener('click',saveExample);timeletFind('#t-editor-form').addEventListener('submit',saveExample);timeletFind('#t-undo').addEventListener('click',()=>{if(!undo)return;records.splice(0,records.length,...undo);undo=null;render();status('已撤销上一步示例操作。');});root.addEventListener('keydown',event=>{if(event.key==='Escape'){if(screen==='editor')switchScreen('main');else if(expanded){expanded='';render();}}});
  timeletFind('#t-repeat').addEventListener('change',syncReferenceFrequency);
  timeletFind('#t-include-time').addEventListener('change',syncReferenceFrequency);
  ['t-name','t-date','t-time'].forEach(id=>timeletFind('#'+id).addEventListener('input',syncReferenceFrequency));
  root.addEventListener('click',event=>{const button=event.target.closest('button');if(button?.dataset.screen==='editor'&&!button.dataset.id){timeletFind('#t-include-time').checked=false;timeletFind('#t-repeat').value='none';}if(button?.dataset.action==='edit'){const record=records.find(r=>r.id===button.dataset.id);timeletFind('#t-include-time').checked=!!record?.time;timeletFind('#t-repeat').value=record?.repeat||'none';}if(button?.dataset.type||button?.dataset.screen==='editor'||button?.dataset.action==='edit')syncReferenceFrequency();});
  render();typePicker();syncReferenceFrequency();
})();
</script>
